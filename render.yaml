# Render Blueprint for felipeharker.org: the portfolio and the standards, one
# static service, built from this repository's main branch. The academic
# projects, the birding report and the resume are their own services, each
# recorded in its own repository's render.yaml.
#
# It is synced as a Render Blueprint (named after this repository): a push
# that changes it changes the service, and a setting changed in the dashboard
# and not here is overwritten at the next sync.
# See wiki/Deploying.md.
services:
  - type: web
    name: hark-site
    runtime: static
    repo: https://github.com/felipeharker/hark_web
    branch: main
    autoDeployTrigger: checksPass          # deploys a push once its Check workflow passes
    renderSubdomainPolicy: disabled        # served only at its custom domain, not onrender.com
    buildCommand: node tools/build.mjs     # assembles dist/
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    domains:
      - felipeharker.org
      - www.felipeharker.org
    # The paths that moved to their own sites in 2026-10, sent there with the
    # rest of the path, in this order.
    routes:
      - type: redirect
        source: /academic
        destination: https://academic.felipeharker.org/
      - type: redirect
        source: /academic/*
        destination: https://academic.felipeharker.org/*
      - type: redirect
        source: /birds
        destination: https://birds.felipeharker.org/
      - type: redirect
        source: /birds/*
        destination: https://birds.felipeharker.org/*
      - type: redirect
        source: /resume
        destination: https://resume.felipeharker.org/
      - type: redirect
        source: /resume/*
        destination: https://resume.felipeharker.org/*
